name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked credentials and private keys
        run: node scripts/check-secret-hygiene.mjs

      # 当前公开根路径必须始终指向数智供社 v8533；历史 v3demo 仅保留在
      # /legacy-v3/，避免用户打开固定链接时落到旧版。源目录不做删除。
      - name: Build site for project subpath
        run: |
          set -e
          node scripts/build-shuzhi-pages-site.mjs _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
