name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 根链接直接发布数智供社 v85。手机访问 index.html 时会自动进入
      # 全屏 H5，电脑访问则保留手机模拟器外壳。
      - name: Build v85 site for project subpath
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R shuzhi-demo/. _site/
          # v85 的商品与村社图片使用绝对路径，统一改为 GitHub Pages 项目子路径。
          find _site/assets -type f -name '*.js' -exec sed -i 's#"/static/#"/gonxiang-village-demo/static/#g' {} +
          mkdir -p _site/static/images/assets
          cp -R v3.1demo/static/images/assets/. _site/static/images/assets/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
