limit_req_zone $binary_remote_addr zone=shuzhi_api:10m rate=20r/s;
server {
    listen 443 ssl http2;
    server_name CHANGE_ME_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/CHANGE_ME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_DOMAIN/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /var/www/shuzhi-v8530/h5;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /admin/ { alias /var/www/shuzhi-v8530/admin/; try_files $uri $uri/ /admin/index.html; }
    location = /health { proxy_pass http://127.0.0.1:8787/health; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health/ready { proxy_pass http://127.0.0.1:8787/health/ready; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/ { limit_req zone=shuzhi_api burst=40 nodelay; proxy_pass http://127.0.0.1:8787/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 1m; }
}
server { listen 80; server_name CHANGE_ME_DOMAIN; return 301 https://$host$request_uri; }
